# Publishes the pack to the Comfy Registry (registry.comfy.org), which is what feeds
# ComfyUI-Manager's built-in search.
#
# Fires on any push to main that touches pyproject.toml — so BUMPING THE VERSION IN
# pyproject.toml IS THE RELEASE. No tag and no GitHub Release is required.
# Can also be run by hand from the Actions tab (workflow_dispatch).
#
# One-time setup:
#   1. Create a publisher at https://registry.comfy.org (the id after "@" is permanent
#      and must match PublisherId in pyproject.toml — currently "Hishamahmer").
#   2. Generate an API key for that publisher.
#   3. Repo → Settings → Secrets and variables → Actions → New repository secret,
#      named exactly REGISTRY_ACCESS_TOKEN.
name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish custom node to registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
